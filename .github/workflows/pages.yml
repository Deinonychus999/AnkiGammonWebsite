name: Deploy Website to GitHub Pages

# Runs on every commit to main/master (for website updates only)
# This does NOT build the application executable - see release.yml for that
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  # The community deck catalog is fetched at build time; rebuild daily so
  # newly approved decks get their static pages and sitemap entries.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  # deck-catalog-changed: sent by the decks Worker when a deck is approved or
  # removed. ankigammon-released: sent by the app's release workflow once
  # PyPI serves the new version, so /app ships it.
  repository_dispatch:
    types: [deck-catalog-changed, ankigammon-released]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build HTML from partials
        run: python website/build.py

      - name: Validate build output
        run: |
          echo "Validating build output..."
          test -f website/build/index.html && echo "✓ index.html exists" || exit 1
          test -d website/build/assets && echo "✓ assets directory exists" || exit 1
          echo "Validation complete!"

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'website/build'

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}

    steps:
      # GitHub sometimes doesn't list a just-uploaded artifact yet ("No artifacts
      # named github-pages were found"); that lookup fails before any deployment
      # is created, so trying again is safe.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
